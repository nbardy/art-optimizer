[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "art-optimizer"
version = "0.3.0"
description = "Human-in-the-loop generative art exploration with four-way preference learning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nicholas Bardy" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-timeout>=2.3,<3",
  "httpx>=0.27,<1",
  "ruff>=0.9,<1",
]
models = [
  "torch>=2.6",
  "diffusers>=0.39,<0.40",
  "transformers>=4.57,<6",
  "accelerate>=1.2,<2",
  "safetensors>=0.5,<1",
  "huggingface-hub>=0.27,<1",
  "sentencepiece>=0.2,<1",
]

[project.scripts]
art-optimizer = "art_optimizer.app:run"

[tool.setuptools.packages.find]
include = ["art_optimizer*"]

[tool.setuptools.package-data]
art_optimizer = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --timeout=30"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
