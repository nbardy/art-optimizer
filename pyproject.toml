[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "art-optimizer"
version = "0.1.0"
description = "Human-in-the-loop generative art exploration with four-way preference learning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nicholas Bardy" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[project.scripts]
art-optimizer = "art_optimizer.app:run"

[tool.setuptools.packages.find]
include = ["art_optimizer*"]

[tool.setuptools.package-data]
art_optimizer = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
