name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Static checks
        run: |
          python -m ruff check .
          python -m compileall -q art_optimizer tests scripts
          node --check art_optimizer/static/app.js

      - name: Unit and integration tests
        run: |
          mkdir -p test-results
          python -m pytest --junitxml=test-results/junit.xml

      - name: Live server smoke test
        env:
          ART_OPTIMIZER_DATA_DIR: ${{ runner.temp }}/art-optimizer-smoke
          ART_OPTIMIZER_IMAGE_SIZE: "96"
        run: |
          python -m uvicorn art_optimizer.app:app --host 127.0.0.1 --port 8765 > test-results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8765/healthz > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8765/healthz > test-results/health.json
          python scripts/smoke_test.py http://127.0.0.1:8765 | tee test-results/smoke.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
